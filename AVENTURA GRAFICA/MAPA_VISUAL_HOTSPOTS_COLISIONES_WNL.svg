<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1080" viewBox="0 0 3840 1080">
<title>WNL - Mapa visual provisional de hotspots y colisiones</title>
<desc>Plano técnico esquemático de la habitación panorámica 3840 por 1080. No es arte final. Muestra muebles, áreas de colisión, circulación, puntos de aproximación, hotspots y dos encuadres de cámara.</desc>
<defs>
 <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#294052" stroke-width="2" opacity=".55"/></pattern>
 <pattern id="walk" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M0 48L48 0" stroke="#2e8b74" stroke-width="3" opacity=".18"/></pattern>
 <style>
 text{font-family:Arial,sans-serif;fill:#e8edf2}
 .small{font-size:24px}.med{font-size:30px}.large{font-size:42px;font-weight:bold}
 .furniture{fill:#33485a;stroke:#a9bdca;stroke-width:5}
 .collision{fill:#df665e;fill-opacity:.23;stroke:#ff786d;stroke-width:7;stroke-dasharray:18 12}
 .hot{fill:#f4b942;stroke:#fff0b8;stroke-width:5}
 .approach{fill:#49c59a;fill-opacity:.2;stroke:#49c59a;stroke-width:5;stroke-dasharray:10 8}
 .camera{fill:none;stroke:#67b7ed;stroke-width:7;stroke-dasharray:22 14}
 .label{font-size:30px;font-weight:bold;fill:#fff}
 </style>
</defs>
<rect width="3840" height="1080" fill="#101b29"/>
<rect width="3840" height="1080" fill="url(#grid)"/>
<rect x="0" y="0" width="1920" height="1080" class="camera"/>
<rect x="1920" y="0" width="1920" height="1080" class="camera"/>
<text x="60" y="70" class="large">WNL · HABITACIÓN — MAPA TÉCNICO PROVISIONAL</text>
<text x="60" y="112" class="med">3840 × 1080 px · Cámara de referencia 1920 × 1080 · Origen (0,0) arriba a la izquierda</text>
<text x="80" y="165" class="med" fill="#67b7ed">ENCUADRE 1 · X 0–1920</text>
<text x="1980" y="165" class="med" fill="#67b7ed">ENCUADRE 2 · X 1920–3840</text>
<path d="M0 760H3840V1080H0Z" fill="#263746" opacity=".9"/>
<path d="M0 850H3840V1015H0Z" fill="url(#walk)" stroke="#49c59a" stroke-width="5" stroke-dasharray="18 12"/>
<text x="80" y="995" class="med" fill="#72e0b8">BANDA PRINCIPAL TRANSITABLE · Y 850–1015 (referencia)</text>
<!-- furniture bodies and collision footprints -->
<g>
 <rect x="180" y="490" width="610" height="335" rx="18" class="furniture"/><text x="300" y="545" class="label">ESCRITORIO / PC</text>
 <rect x="180" y="730" width="610" height="95" rx="10" class="collision"/>
 <rect x="430" y="690" width="240" height="190" rx="22" class="furniture"/><text x="465" y="780" class="small">SILLA</text><rect x="455" y="790" width="190" height="85" class="collision"/>
 <rect x="900" y="300" width="530" height="490" rx="16" class="furniture"/><text x="1000" y="365" class="label">BIBLIOTECA</text><rect x="900" y="690" width="530" height="100" class="collision"/>
 <rect x="1120" y="680" width="390" height="150" rx="12" class="furniture"/><text x="1150" y="750" class="small">MUEBLE CONSULTA</text><rect x="1120" y="750" width="390" height="80" class="collision"/>
 <rect x="1650" y="500" width="550" height="325" rx="16" class="furniture"/><text x="1740" y="560" class="label">CONSOLA</text><rect x="1650" y="730" width="550" height="95" class="collision"/>
 <rect x="1810" y="420" width="260" height="170" rx="12" class="furniture"/><text x="1840" y="485" class="small">RADIO</text>
 <rect x="2110" y="610" width="230" height="180" rx="12" class="furniture"/><text x="2130" y="680" class="small">GRABADORA</text><rect x="2110" y="730" width="230" height="60" class="collision"/>
 <rect x="2390" y="520" width="310" height="305" rx="14" class="furniture"/><text x="2420" y="585" class="label">ARCHIVO</text><rect x="2390" y="730" width="310" height="95" class="collision"/>
 <rect x="2850" y="500" width="670" height="350" rx="22" class="furniture"/><text x="3070" y="570" class="large">CAMA</text><rect x="2850" y="740" width="670" height="110" class="collision"/>
 <rect x="2700" y="690" width="170" height="145" rx="12" class="furniture"/><text x="2705" y="750" class="small">MESA</text><rect x="2700" y="780" width="170" height="55" class="collision"/>
 <rect x="3540" y="330" width="260" height="520" rx="14" class="furniture"/><text x="3560" y="400" class="small">ARMARIO</text><rect x="3540" y="730" width="260" height="120" class="collision"/>
 <rect x="3220" y="170" width="160" height="160" rx="80" class="furniture"/><text x="3250" y="265" class="small">RELOJ</text>
</g>
<!-- approach zones -->
<g class="approach">
 <ellipse cx="500" cy="850" rx="100" ry="45"/><ellipse cx="620" cy="850" rx="90" ry="40"/>
 <ellipse cx="1120" cy="850" rx="110" ry="42"/><ellipse cx="1370" cy="850" rx="110" ry="42"/>
 <ellipse cx="1840" cy="850" rx="105" ry="42"/><ellipse cx="2010" cy="850" rx="100" ry="42"/>
 <ellipse cx="2260" cy="850" rx="100" ry="42"/><ellipse cx="2530" cy="850" rx="100" ry="42"/>
 <ellipse cx="2780" cy="870" rx="100" ry="42"/><ellipse cx="3150" cy="870" rx="120" ry="42"/>
 <ellipse cx="3660" cy="870" rx="105" ry="42"/>
</g>
<!-- hotspot markers -->
<g class="hot">
 <circle cx="665" cy="625" r="30"/><circle cx="355" cy="680" r="30"/><circle cx="550" cy="735" r="30"/>
 <circle cx="1160" cy="420" r="30"/><circle cx="1300" cy="610" r="30"/><circle cx="1800" cy="650" r="30"/>
 <circle cx="1940" cy="510" r="30"/><circle cx="2220" cy="700" r="30"/><circle cx="2550" cy="660" r="30"/>
 <circle cx="2460" cy="610" r="30"/><circle cx="3180" cy="690" r="30"/><circle cx="3300" cy="250" r="30"/>
 <circle cx="3670" cy="620" r="30"/><circle cx="2780" cy="730" r="30"/><circle cx="700" cy="760" r="30"/>
</g>
<g fill="#182333" font-size="23" font-weight="bold" text-anchor="middle">
 <text x="665" y="633">01</text><text x="355" y="688">02</text><text x="550" y="743">03</text>
 <text x="1160" y="428">04</text><text x="1300" y="618">05</text><text x="1800" y="658">06</text>
 <text x="1940" y="518">07</text><text x="2220" y="708">08</text><text x="2550" y="668">09</text>
 <text x="2460" y="618">10</text><text x="3180" y="698">11</text><text x="3300" y="258">12</text>
 <text x="3670" y="628">13</text><text x="2780" y="738">14</text><text x="700" y="768">15</text>
</g>
<!-- legend -->
<rect x="60" y="190" width="700" height="190" rx="18" fill="#0b1420" stroke="#8297a8" stroke-width="3" opacity=".96"/>
<text x="90" y="235" class="med">LEYENDA</text>
<rect x="90" y="260" width="38" height="28" class="collision"/><text x="150" y="285" class="small">Colisión sólida (simplificada)</text>
<ellipse cx="110" cy="325" rx="24" ry="13" class="approach"/><text x="150" y="334" class="small">Punto / zona de aproximación</text>
<circle cx="110" cy="365" r="17" class="hot"/><text x="150" y="374" class="small">Hotspot numerado</text>
<text x="820" y="1045" class="small">ESQUEMA DE BLOQUEO: no es ilustración final ni confirma todavía la posición definitiva del mobiliario.</text>
</svg>